[package]
# The lib name must be unique in every sync target: the OtterSec verifier builds the first
# crate whose lib name matches, and the Stellar OneSig crate is named `onesig`.
name = "onesig-solana"
version = "0.0.1"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "onesig_solana"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = ["custom-heap"]
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
# Opt-in instrumentation for measuring runs, never enabled in a shipped build. Declared with no
# dependencies so the default feature graph — and therefore the default binary — is untouched.
heap-profiling = []


[dependencies]
anchor-lang = { workspace = true, features = ["event-cpi"] }
hex-literal = "0.4.1"
heap-allocator = { path = "../../dependencies/heap-allocator-solana-contracts/lib" }
program-id = { path = "../../dependencies/program-id-solana-contracts/lib" }
proc-macro2 = "=1.0.106"
solana-keccak-hasher = "3.1.0"
solana-secp256k1-recover = "3.1.0"

[dev-dependencies]
hex = "0.4.3"
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
