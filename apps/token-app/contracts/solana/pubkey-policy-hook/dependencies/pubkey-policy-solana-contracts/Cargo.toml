[workspace]
resolver = "2"
members = [ "interface", "programs/pubkey_policy" ]
exclude = [ "dependencies" ]

[workspace.dependencies]
solana-account = "4.3"
solana-instruction = "3.2"
solana-program-error = "3.0"
solana-pubkey = "4.1"

[workspace.dependencies.anchor-lang]
version = "=1.2.1"
default-features = false
features = [ "init-if-needed", "event-cpi", "solana-v4" ]

[workspace.dependencies.num_enum]
version = "0.7"
default-features = false

[workspace.dependencies.program-id]
path = "../program-id-solana-contracts/lib"

[workspace.dependencies.rbac]
path = "../rbac-solana-contracts"

[workspace.dependencies.pubkey-policy-interface]
path = "interface"

[workspace.dependencies.pubkey-policy]
path = "programs/pubkey_policy"
features = [ "no-entrypoint" ]

[workspace.dependencies.mollusk-svm]
version = "0.16"
features = [ "inner-instructions" ]

[workspace.dependencies.mollusk-svm-result]
version = "0.16"
features = [ "inner-instructions" ]

[workspace.lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [ "cfg(target_os, values(\"solana\"))", "cfg(feature, values(\"anchor-debug\", \"custom-heap\", \"custom-panic\"))" ]

[profile.release]
overflow-checks = true
