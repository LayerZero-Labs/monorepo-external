[package]
name = "token-manager"
version = "0.1.0"
authors = ["LayerZero Labs", "Shankar (@shankars99)"]
edition = "2021"
license = "MIT"
description = "Per-mint RBAC, Token ACL gate and single-authority signer PDAs"

[lib]
crate-type = ["cdylib", "lib"]
name = "token_manager"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "token-manager-interface/idl-build", "pubkey-policy-interface/idl-build", "pubkey-policy-hook/idl-build", "rbac/idl-build"]

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
program-id.workspace = true
token-manager-interface.workspace = true
pubkey-policy-interface.workspace = true
pubkey-policy-hook.workspace = true
rbac.workspace = true
num_enum.workspace = true
borsh.workspace = true
spl-token-2022.workspace = true
spl-token-2022-interface.workspace = true
token-acl-client.workspace = true
token-acl-interface.workspace = true
spl-discriminator.workspace = true
spl-tlv-account-resolution.workspace = true

[lints]
workspace = true
