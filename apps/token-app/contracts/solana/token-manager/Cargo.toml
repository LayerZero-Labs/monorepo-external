[workspace]
resolver = "2"
members = [
    "interface",
    "programs/token_manager",
    "tests",
]
exclude = ["dependencies", "fixtures/token_acl", "fixtures/token_2022"]

[workspace.dependencies]
anchor-lang = { version = "=1.2.1", default-features = false, features = ["init-if-needed", "event-cpi", "solana-v4"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["token", "token_2022", "associated_token", "solana-v4"] }
borsh = "=1.6.1"
num_enum = { version = "0.7", default-features = false }
program-id = { path = "dependencies/program-id-solana-contracts/lib" }
rbac = { path = "dependencies/rbac-solana-contracts" }
pubkey-policy-interface = { path = "dependencies/pubkey-policy-solana-contracts/interface" }
pubkey-policy = { path = "dependencies/pubkey-policy-solana-contracts/programs/pubkey_policy", features = ["no-entrypoint"] }
token-manager-interface = { path = "interface" }
token-manager = { path = "programs/token_manager", features = ["no-entrypoint"] }
pubkey-policy-hook = { path = "dependencies/pubkey-policy-hook-solana-contracts/programs/pubkey_policy_hook", features = ["no-entrypoint"] }
solana-account = "4.3"
solana-instruction = "3.2"
solana-pubkey = "4.1"
solana-program-error = "3.0"
solana-program-option = "3.1"
solana-program-pack = "3.1"
solana-system-interface = { version = "3.0", features = ["bincode"] }
spl-discriminator = "0.5.2"
spl-pod = "=0.7.2"
spl-tlv-account-resolution = "0.11.2"
spl-type-length-value = "0.9.1"
spl-token-2022 = { version = "=11.0.0", features = ["no-entrypoint"] }
spl-token-2022-interface = "=3.1.1"
spl-transfer-hook-interface = "2.1.0"
spl-associated-token-account-interface = "2.0.0"
token-acl-interface = { git = "https://github.com/solana-foundation/token-acl", rev = "bfbaf589662631ca84f3462514620a499405c6d7" }
token-acl-client = { git = "https://github.com/solana-foundation/token-acl", rev = "bfbaf589662631ca84f3462514620a499405c6d7" }
mollusk-svm = { version = "0.16", features = ["inner-instructions"] }
mollusk-svm-programs-token = { version = "0.16", default-features = false, features = ["token-2022", "associated-token"] }
mollusk-svm-result = { version = "0.16", features = ["inner-instructions"] }
futures = "0.3"

[profile.release]
overflow-checks = true

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))'] }
