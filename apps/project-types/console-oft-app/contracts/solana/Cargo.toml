[workspace]
resolver = "2"
members = [
    "programs/console_oft",
    "tests/programs/example_composer",
    "tests/programs/forwarding_composer",
    "tests/programs/multihop_composer",
    "tests/programs/transfer_hook_fixture",
    "tests/integration",
]
exclude = ["dependencies"]

[workspace.dependencies]
# Anchor
# `solana-v4` builds against Token-2022 interface 3.x, which knows PermissionedBurn; the default
# `solana-v3` cohort's 2.x cannot size those mints (otter-sec/anchor#5138).
anchor-lang = { version = "1.2.1", default-features = false, features = ["solana-v4"] }
anchor-spl = { version = "1.2.1", default-features = false, features = [
    "associated_token",
    "mint",
    "token",
    "token_2022",
    "token_2022_extensions",
    "solana-v4",
] }

# Local crates
token-manager-interface = { path = "dependencies/token-manager-solana-contracts/interface" }
pubkey-policy-interface = { path = "dependencies/pubkey-policy-solana-contracts/interface" }
token-manager = { path = "dependencies/token-manager-solana-contracts/programs/token_manager", features = ["cpi"] }
pubkey-policy-hook = { path = "dependencies/pubkey-policy-hook-solana-contracts/programs/pubkey_policy_hook", features = ["no-entrypoint"] }
pubkey-policy = { path = "dependencies/pubkey-policy-solana-contracts/programs/pubkey_policy", features = ["no-entrypoint"] }
oapp = { path = "dependencies/oapp-solana-contracts" }
oft = { path = "dependencies/oft-solana-contracts" }
heap-allocator = { path = "dependencies/heap-allocator-solana-contracts/lib" }
program-id = { path = "dependencies/program-id-solana-contracts/lib" }
rbac = { path = "dependencies/rbac-solana-contracts" }

# Common
borsh = "=1.6.1"
num_enum = { version = "0.7", default-features = false }

# Solana
solana-account = "4.3"
solana-instruction = "3.2"
solana-keccak-hasher = "3.1.0"
solana-program-error = "3.0"
solana-program-option = "3.1.0"
solana-program-pack = "3.1.0"
solana-pubkey = "4.1"

# SPL
spl-discriminator = "0.5.2"
spl-tlv-account-resolution = "0.11.1"
spl-token-2022 = "11.0.0"
spl-token-2022-interface = "=3.1.1"
spl-transfer-hook-interface = "2.1.0"
spl-type-length-value = "0.9.1"

# Testing
mollusk-svm = "0.16"
mollusk-svm-programs-token = { version = "0.16", default-features = false }
mollusk-svm-result = "0.16"

[profile.release]
overflow-checks = true
