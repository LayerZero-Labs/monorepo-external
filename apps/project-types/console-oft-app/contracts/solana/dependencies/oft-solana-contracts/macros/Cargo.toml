[package]
name = "oft-macros"
version = "0.1.0"
description = "Procedural macros for OFT in Anchor programs"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
darling = "0.20"
proc-macro2 = "1.0"
quote = "1.0"
itertools = "0.14"

[dependencies.syn]
version = "2.0"
features = [ "full", "parsing" ]

[dependencies.anchor-trait]
path = "../../framework-solana-anchor-trait"
