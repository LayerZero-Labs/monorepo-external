[package]
name = "token-2022-fixture"
version = "0.1.0"
edition = "2021"
publish = false
description = "Test-only SBF entrypoint for the exact Token-2022 11 processor"

[lib]
name = "token_2022_fixture"
crate-type = [ "cdylib" ]
test = false
doctest = false

[dependencies]
solana-account-info = "=3.1.1"
solana-address = "2.6.0"
solana-program-entrypoint = "=3.1.1"
solana-program-error = "3.0"

[dependencies.spl-token-2022]
version = "=11.0.0"
features = [ "no-entrypoint" ]

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [ "cfg(target_os, values(\"solana\"))", "cfg(feature, values(\"custom-heap\", \"custom-panic\"))" ]
