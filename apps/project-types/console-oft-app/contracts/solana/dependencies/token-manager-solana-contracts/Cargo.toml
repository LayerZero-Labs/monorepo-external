[workspace]
resolver = "2"
members = [ "interface", "programs/token_manager" ]
exclude = [ "dependencies", "fixtures/token_acl", "fixtures/token_2022" ]

[workspace.dependencies]
borsh = "=1.6.1"
solana-account = "4.3"
solana-instruction = "3.2"
solana-pubkey = "4.1"
solana-program-error = "3.0"
solana-program-option = "3.1"
solana-program-pack = "3.1"
spl-discriminator = "0.5.2"
spl-pod = "=0.7.2"
spl-tlv-account-resolution = "0.11.2"
spl-type-length-value = "0.9.1"
spl-token-2022-interface = "=3.1.1"
spl-transfer-hook-interface = "2.1.0"
spl-associated-token-account-interface = "2.0.0"
futures = "0.3"

[workspace.dependencies.anchor-lang]
version = "=1.2.1"
default-features = false
features = [ "init-if-needed", "event-cpi", "solana-v4" ]

[workspace.dependencies.anchor-spl]
version = "=1.2.1"
default-features = false
features = [ "token", "token_2022", "associated_token", "solana-v4" ]

[workspace.dependencies.num_enum]
version = "0.7"
default-features = false

[workspace.dependencies.program-id]
path = "../program-id-solana-contracts/lib"

[workspace.dependencies.rbac]
path = "../rbac-solana-contracts"

[workspace.dependencies.pubkey-policy-interface]
path = "../pubkey-policy-solana-contracts/interface"

[workspace.dependencies.pubkey-policy]
path = "../pubkey-policy-solana-contracts/programs/pubkey_policy"
features = [ "no-entrypoint" ]

[workspace.dependencies.token-manager-interface]
path = "interface"

[workspace.dependencies.token-manager]
path = "programs/token_manager"
features = [ "no-entrypoint" ]

[workspace.dependencies.pubkey-policy-hook]
path = "../pubkey-policy-hook-solana-contracts/programs/pubkey_policy_hook"
features = [ "no-entrypoint" ]

[workspace.dependencies.solana-system-interface]
version = "3.0"
features = [ "bincode" ]

[workspace.dependencies.spl-token-2022]
version = "=11.0.0"
features = [ "no-entrypoint" ]

[workspace.dependencies.token-acl-interface]
git = "https://github.com/solana-foundation/token-acl"
rev = "bfbaf589662631ca84f3462514620a499405c6d7"

[workspace.dependencies.token-acl-client]
git = "https://github.com/solana-foundation/token-acl"
rev = "bfbaf589662631ca84f3462514620a499405c6d7"

[workspace.dependencies.mollusk-svm]
version = "0.16"
features = [ "inner-instructions" ]

[workspace.dependencies.mollusk-svm-programs-token]
version = "0.16"
default-features = false
features = [ "token-2022", "associated-token" ]

[workspace.dependencies.mollusk-svm-result]
version = "0.16"
features = [ "inner-instructions" ]

[workspace.lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [ "cfg(target_os, values(\"solana\"))", "cfg(feature, values(\"anchor-debug\", \"custom-heap\", \"custom-panic\"))" ]

[profile.release]
overflow-checks = true
