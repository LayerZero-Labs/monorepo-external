[package]
name = "oapp"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"
members = [ "macros" ]
exclude = [ "dependencies" ]

[features]
default = []
idl-build = [ "anchor-lang/idl-build", "anchor-spl/idl-build", "oapp-macros/idl-build" ]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [ "cfg(target_os, values(\"solana\"))" ]

[dependencies]
solana-keccak-hasher = "3.1.0"
spl-discriminator = "0.5.2"

[dependencies.anchor-lang]
version = "1.2.1"
default-features = false
features = [ "solana-v4" ]

[dependencies.anchor-spl]
version = "1.2.1"
default-features = false
features = [ "associated_token", "mint", "token", "token_2022", "token_2022_extensions", "solana-v4" ]

[dependencies.oapp-macros]
path = "macros"

[dependencies.spl-type-length-value]
version = "0.9.1"
features = [ "derive" ]

[profile.release]
overflow-checks = true
