[workspace]
members = [
    "programs/*",
    "libs/*",
]
resolver = "2"

[profile.dev]
opt-level = 0
incremental = true
codegen-units = 256

# Optimize deps even in dev: crypto crates (curve25519-dalek, zk, blake3, sha2) are
# unusably slow at opt-level 0 and dominate test runtime.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
incremental = true

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 20
[profile.release.build-override]
opt-level = 0
incremental = false
codegen-units = 20


[profile.fast]
codegen-units = 20
inherits = "release"
[profile.fast.build-override]
opt-level = 0
codegen-units = 20
