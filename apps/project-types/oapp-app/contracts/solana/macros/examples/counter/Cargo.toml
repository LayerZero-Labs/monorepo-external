[package]
name = "counter"
version = "0.0.1"
description = "Minimal counter example demonstrating oapp-macros"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "counter"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "oapp/idl-build", "rbac/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    "cfg(feature, values(\"anchor-debug\"))",
    "cfg(target_os, values(\"solana\"))",
] }

[dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = ["init-if-needed", "event-cpi", "solana-v4"] }
anchor-spl = { version = "1.2.1", default-features = false, features = ["associated_token", "mint", "token", "token_2022", "token_2022_extensions", "solana-v4"] }
borsh = {version = "=1.6.1", features = ["derive"] }
oapp = { path = "../../.." }
rbac = { path = "../../../dependencies/rbac-solana-contracts" }
num_enum = { version = "0.7", default-features = false }
spl-discriminator = "0.5.2"
spl-type-length-value = { version = "0.9.1", features = ["derive"] }

[dev-dependencies]
mollusk-svm = { version = "0.16", features = ["inner-instructions"] }
solana-account = "4.3"
solana-instruction = "3.2"
solana-program-error = "3.0"
solana-pubkey = "4.1"
