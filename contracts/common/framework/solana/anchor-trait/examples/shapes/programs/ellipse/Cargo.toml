[package]
name = "shapes-ellipse"
version = "0.0.1"
description = "Ellipse shapes example implementation for anchor-trait"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "shapes_ellipse"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "shapes-macros/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    "cfg(feature, values(\"anchor-debug\"))",
    "cfg(target_os, values(\"solana\"))",
] }

[dependencies]
anchor-lang = { workspace = true }
shapes-macros = { workspace = true }

[dev-dependencies]
mollusk-svm = { workspace = true }
solana-account = { workspace = true }
solana-instruction = { workspace = true }
solana-program-error = { workspace = true }
solana-pubkey = { workspace = true }
