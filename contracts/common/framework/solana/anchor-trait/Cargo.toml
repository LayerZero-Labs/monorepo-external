[package]
name = "anchor-trait"
version = "0.1.0"
edition = "2021"
description = "Trait-like instruction interfaces for Anchor Solana programs with compile-time enforcement and default implementations"

[workspace]
resolver = "2"
members = [
    "examples/shapes/macros",
    "examples/shapes/programs/ellipse",
    "examples/shapes/programs/triangle",
]

[workspace.dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = ["solana-v4"] }
anchor-trait = { path = "." }
shapes-macros = { path = "examples/shapes/macros" }
mollusk-svm = { version = "0.16", features = ["inner-instructions"] }
solana-account = "4.3"
solana-instruction = "3.2"
solana-pubkey = "4.1"
solana-program-error = "3.0"

[features]
idl-build = []

[dependencies]
itertools = "0.14"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing"] }

[dev-dependencies]
insta = "1.41"
prettyplease = "0.2"

[profile.release]
overflow-checks = true
