minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@layerzerolabs/*'
  - '@stargatefinance/*'
verifyDepsBeforeRun: false
cleanupUnusedCatalogs: true
disallowWorkspaceCycles: true
linkWorkspacePackages: true
preferWorkspacePackages: true
engineStrict: true
publicHoistPattern:
  - '*eslint*'
packageConfigs:
  '@layerzerolabs/lz-network-app':
    saveExact: true
packageExtensions:
  '@hookform/resolvers':
    dependencies:
      zod: 4.3.5
  '@solana-developers/helpers':
    dependencies:
      '@noble/hashes': ^1.3.1
  '@ronomon/crypto-async':
    dependencies:
      node-gyp: ^12.2.0
packages:
  - activities/**
  - adapters/**
  - apps/**
  - clusters/**
  - configs/**
  - contracts/**
  - deployments/**
  - infrastructure/**
  - '!infrastructure/cdk/frontend-cdk/lib/scan-canary/**'
  - '!infrastructure/cdk/frontend-cdk/lib/icons-service/**'
  - migrated/**
  - onboarding/**
  - packages/**
  - scripts/**
  - tooling-configs/**
  - tools/**
  - views/**
  - workflows/**
  - '!**/cdk.out/**'
  - '!**/debug_info/**'
  - '!**/src/daml/**'
  - '!**/dist/daml/**'
  - '!**/.next/**'
  - '!tools/alarm-investigator/docker/**'
